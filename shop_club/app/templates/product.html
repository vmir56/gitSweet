{% extends "base.html" %}

{% block title %}Добавление товара - Админ панель{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="admin-header">
        <h1>➕ Добавление нового товара</h1>
        <a href="/admin/products" class="btn-back">← Назад к списку товаров</a>
    </div>
    <div class="product-form-container">
        <form id="productForm" class="product-form">
            <div class="form-group">
                <label for="name" class="required">Название товара</label>
                <input type="text" id="name" name="name" required 
                       placeholder="Например: iPhone 17 Pro" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" name="description" rows="4" 
                          placeholder="Подробное описание товара..."></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="price" class="required">Цена (₽)</label>
                    <input type="number" id="price" name="price" step="0.01" required 
                           placeholder="9990.00" min="0">
                </div>
                
                <div class="form-group">
                    <label for="stock" class="required">Количество на складе</label>
                    <input type="number" id="stock" name="stock" required 
                           placeholder="100" min="0">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="category_id">Категория</label>
                    <select id="category_id" name="category_id">
                        <option value="">Выберите категорию</option>
                        <!-- Категории загружаются через JavaScript -->
                    </select>
                    <button type="button" class="btn-add-category" onclick="showAddCategoryModal()">
                        + Новая категория
                    </button>
                </div>

                <div class="form-group">
                    <label for="image">Изображение товара</label>
                    <input type="file" id="image" name="image" accept="image/*" onchange="previewImage(this)">
                    <div class="image-preview" id="imagePreview" style="display: none;">
                        <img id="previewImg" src="" alt="Preview">
                        <button type="button" onclick="clearImage()">✖</button>
                    </div>
                    <input type="hidden" id="image_url" name="image_url">
                    <small>Поддерживаются форматы: JPG, PNG, GIF, WEBP</small>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-submit">➕ Добавить товар</button>
                <button type="reset" class="btn-reset">🗑️ Очистить форму</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальное окно для добавления категории -->
<div id="categoryModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h2>Добавить категорию</h2>
        <form id="categoryForm">
            <div class="form-group">
                <label for="cat_name">Название категории</label>
                <input type="text" id="cat_name" required placeholder="Например: Электроника">
            </div>
            <div class="form-group">
                <label for="cat_description">Описание категории</label>
                <textarea id="cat_description" rows="3" placeholder="Описание..."></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-submit">Добавить</button>
                <button type="button" class="btn-reset" onclick="closeModal()">Отмена</button>
            </div>
        </form>
    </div>
</div>

<style>
    .admin-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
    }
    
    .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
    }
    
    .admin-header h1 {
        margin: 0;
        color: #333;
    }
    
    .btn-back {
        background: #6c757d;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        text-decoration: none;
        transition: background 0.3s;
    }
    
    .btn-back:hover {
        background: #5a6268;
    }
    
    .product-form-container {
        background: white;
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    
    .product-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }
    
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
    }
    
    label {
        font-weight: 600;
        color: #333;
    }
    
    label.required::after {
        content: " *";
        color: #e74c3c;
    }
    
    input, select, textarea {
        padding: 0.75rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s;
        font-family: inherit;
    }
    
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .btn-add-category {
        margin-top: 0.5rem;
        background: #28a745;
        color: white;
        border: none;
        padding: 0.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
    }
    
    .btn-add-category:hover {
        background: #218838;
    }
    
    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 1rem;
    }
    
    .btn-submit {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        flex: 1;
    }
    
    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-reset {
        background: #dc3545;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
    }
    
    .btn-reset:hover {
        background: #c82333;
    }
    
    .image-preview {
        margin-top: 0.5rem;
        position: relative;
        display: inline-block;
    }
    
    .image-preview img {
        max-width: 100px;
        max-height: 100px;
        border-radius: 8px;
        border: 1px solid #ddd;
    }
    
    .image-preview button {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #dc3545;
        color: white;
        border: none;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        cursor: pointer;
        font-size: 12px;
    }
    
    /* Модальное окно */
    .modal {
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    
    .modal-content {
        background-color: white;
        margin: 10% auto;
        padding: 2rem;
        border-radius: 15px;
        width: 90%;
        max-width: 500px;
        position: relative;
    }
    
    .modal-close {
        position: absolute;
        right: 1rem;
        top: 1rem;
        font-size: 1.5rem;
        cursor: pointer;
        color: #999;
    }
    
    .modal-close:hover {
        color: #333;
    }
    
    .message {
        position: fixed;
        top: 80px;
        right: 20px;
        padding: 1rem;
        border-radius: 8px;
        animation: slideIn 0.3s ease;
        z-index: 1000;
    }
    
    .message.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    
    .message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    
    @keyframes slideIn {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    
    @media (max-width: 600px) {
        .form-row {
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        
        .admin-container {
            padding: 1rem;
        }
        
        .product-form-container {
            padding: 1rem;
        }
    }
</style>

<script>
    // Загрузка категорий
    async function loadCategories() {
        try {
            const response = await fetch('/admin/categories', {
                credentials: 'same-origin'
            });
            
            if (response.ok) {
                const categories = await response.json();
                const select = document.getElementById('category_id');
                
                // Очищаем существующие опции (кроме первой)
                while (select.options.length > 1) {
                    select.remove(1);
                }
                
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    select.appendChild(option);
                });
            } else if (response.status === 401) {
                window.location.href = '/auth/login';
            }
        } catch (error) {
            console.error('Ошибка загрузки категорий:', error);
        }
    }
    
    // Показ сообщения
    function showMessage(message, type) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;
        messageDiv.textContent = message;
        document.body.appendChild(messageDiv);
        setTimeout(() => messageDiv.remove(), 3000);
    }
    
    // Предпросмотр изображения
    document.getElementById('image_url').addEventListener('input', function() {
        const url = this.value;
        const preview = document.getElementById('imagePreview');
        const img = document.getElementById('previewImg');
        
        if (url && (url.startsWith('http') || url.startsWith('https'))) {
            img.src = url;
            preview.style.display = 'inline-block';
        } else {
            preview.style.display = 'none';
        }
    });
    
    function clearImagePreview() {
        document.getElementById('image_url').value = '';
        document.getElementById('imagePreview').style.display = 'none';
    }
    
    // Модальное окно для категорий
    function showAddCategoryModal() {
        document.getElementById('categoryModal').style.display = 'block';
    }
    
    function closeModal() {
        document.getElementById('categoryModal').style.display = 'none';
        document.getElementById('categoryForm').reset();
    }
    
    // Добавление категории
    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('cat_name').value;
        const description = document.getElementById('cat_description').value;
        
        try {
            const response = await fetch('/admin/categories', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({ name, description })
            });
            
            if (response.ok) {
                showMessage('✅ Категория добавлена!', 'success');
                closeModal();
                loadCategories(); // Перезагружаем список категорий
            } else {
                const error = await response.json();
                showMessage(`❌ Ошибка: ${error.detail || 'Не удалось добавить категорию'}`, 'error');
            }
        } catch (error) {
            showMessage('❌ Ошибка соединения', 'error');
        }
    });
    
    // Отправка формы добавления товара
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = {
            name: document.getElementById('name').value,
            description: document.getElementById('description').value || null,
            price: parseFloat(document.getElementById('price').value),
            stock: parseInt(document.getElementById('stock').value),
            category_id: document.getElementById('category_id').value || null,
            image_url: document.getElementById('image_url').value || null
        };
        
        // Валидация
        if (formData.price <= 0) {
            showMessage('❌ Цена должна быть больше 0', 'error');
            return;
        }
        
        if (formData.stock < 0) {
            showMessage('❌ Количество на складе не может быть отрицательным', 'error');
            return;
        }
        
        try {
            const response = await fetch('/admin/products', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify(formData)
            });
            
            if (response.ok) {
                const result = await response.json();
                showMessage(`✅ Товар "${result.product.name}" успешно добавлен!`, 'success');
                document.getElementById('productForm').reset();
                clearImagePreview();
                
                setTimeout(() => {
                    window.location.href = '/admin/products';
                }, 1500);
            } else if (response.status === 401) {
                window.location.href = '/auth/login';
            } else {
                const error = await response.json();
                showMessage(`❌ Ошибка: ${error.detail || 'Не удалось добавить товар'}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            showMessage('❌ Ошибка соединения с сервером', 'error');
        }
    });
    
    // Закрытие модального окна при клике вне его
    window.onclick = function(event) {
        const modal = document.getElementById('categoryModal');
        if (event.target === modal) {
            closeModal();
        }
    };
    
    // Загрузка категорий при загрузке страницы
    loadCategories();


    // Предпросмотр и загрузка изображения
    async function previewImage(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                const img = document.getElementById('previewImg');
                img.src = e.target.result;
                preview.style.display = 'inline-block';
            };
            
            reader.readAsDataURL(file);
            
            // Загружаем файл на сервер
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/admin/upload-image', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('image_url').value = data.image_url;
                    showMessage('✅ Изображение загружено', 'success');
                } else {
                    showMessage('❌ Ошибка загрузки изображения', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showMessage('❌ Ошибка соединения', 'error');
            }
        }
    }

    function clearImage() {
        document.getElementById('image').value = '';
        document.getElementById('imagePreview').style.display = 'none';
        document.getElementById('image_url').value = '';
    }
</script>
{% endblock %}
